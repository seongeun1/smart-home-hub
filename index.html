<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Home Hub</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
        body {
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background 2s ease, filter 2s ease;
        }
        .night-mode {
            filter: brightness(0.85);
            background: linear-gradient(135deg, #e0e0e0, #cccccc);
        }
        #clock {
            margin-top: 1rem;
            font-size: 5rem;
            font-weight: bold;
        }
        #date {
            font-size: 1.6rem;
            margin-top: 0.3rem;
            color: #555;
        }
        #info-container {
            display: flex;
            gap: 2.5rem;
            margin-top: 1rem;
            color: #666;
            font-size: 1.2rem;
        }
        #calendar-wrapper {
            margin-top: 3rem;
            width: 88%;
            max-width: 1000px;
            background: rgba(0, 0, 0, 0.03);
            padding: 1.2rem;
            border-radius: 12px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .card-title {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .add-hint {
            font-size: 0.9rem;
            color: #0066cc;
            font-weight: normal;
            text-transform: none;
            text-decoration: none;
        }
        .add-hint:hover {
            text-decoration: underline;
        }
        #calendar-frame-container {
            width: 100%;
            height: 450px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>
    <div id="date">Month 00, 0000 Day</div>
    
    <div id="info-container">
        <div id="weather">Loading weather...</div>
        <div id="sun-info">Loading sun schedule...</div>
    </div>

    <!-- Google Calendar Embed Section -->
    <div id="calendar-wrapper">
        <div class="card-title">
            GOOGLE CALENDAR
            <a href="https://calendar.google.com" target="_blank" class="add-hint">+ Open Google Calendar</a>
        </div>
        <div id="calendar-frame-container">
            <!-- 여기에 구글 캘린더 임베드 화면이 들어갑니다 -->
            <iframe src="" id="google-calendar-iframe" style="border: 0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
        </div>
    </div>

    <script src="config.js"></script>

    <script>
        let sunriseTime = null;
        let sunsetTime = null;

        async function fetchWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=33.7490&longitude=-84.3880&current=temperature_2m,weather_code&temperature_unit=fahrenheit');
                const data = await response.json();
                const tempF = Math.round(data.current.temperature_2m);
                const tempC = Math.round((tempF - 32) * 5 / 9);
                document.getElementById('weather').textContent = `Atlanta: ${tempF}°F (${tempC}°C)`;
            } catch (error) {
                document.getElementById('weather').textContent = "Weather unavailable";
            }
        }

        async function fetchSunSchedule() {
            try {
                const response = await fetch('https://api.sunrise-sunset.org/json?lat=33.7490&lng=-84.3880&formatted=0');
                const data = await response.json();
                if (data.status === "OK") {
                    sunriseTime = new Date(data.results.sunrise);
                    sunsetTime = new Date(data.results.sunset);
                    
                    const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: true };
                    const sunriseStr = sunriseTime.toLocaleTimeString('en-US', timeOptions);
                    const sunsetStr = sunsetTime.toLocaleTimeString('en-US', timeOptions);

                    document.getElementById('sun-info').textContent = 
                        `Sunrise: ${sunriseStr} | Sunset: ${sunsetStr}`;
                }
            } catch (error) {
                document.getElementById('sun-info').textContent = "Sun schedule unavailable";
            }
        }

        function initCalendarEmbed() {
            if (typeof CONFIG !== 'undefined' && CONFIG.CALENDAR_EMBED_URL) {
                document.getElementById('google-calendar-iframe').src = CONFIG.CALENDAR_EMBED_URL;
            } else {
                document.getElementById('calendar-frame-container').innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">Please set CONFIG.CALENDAR_EMBED_URL in config.js</div>';
            }
        }

        function updateDashboard() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);

            if (sunriseTime && sunsetTime) {
                if (now < sunriseTime || now > sunsetTime) {
                    document.body.classList.add('night-mode');
                } else {
                    document.body.classList.remove('night-mode');
                }
            }
        }

        fetchWeather();
        fetchSunSchedule();
        initCalendarEmbed();
        
        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>

</body>
</html>
