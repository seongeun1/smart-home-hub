<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Smart Home Hub</title>
    <style>
        body {
            background: linear-gradient(135deg, #111, #222);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background 2s ease, filter 2s ease;
        }
        .night-mode {
            filter: brightness(0.4); /* Dims the screen appearance at night */
        }
        #clock {
            font-size: 6rem;
            font-weight: bold;
        }
        #date {
            font-size: 2rem;
            margin-top: 1rem;
            color: #aaa;
        }
        #sun-info {
            font-size: 1rem;
            margin-top: 1.5rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>
    <div id="date">0000년 00월 00일 요일</div>
    <div id="sun-info">Loading sun schedule...</div>

    <script>
        let sunriseTime = null;
        let sunsetTime = null;

        // Fetch sunrise and sunset times for Atlanta
        async function fetchSunSchedule() {
            try {
                const response = await fetch('https://api.sunrise-sunset.org/json?lat=33.7490&lng=-84.3880&formatted=0');
                const data = await response.json();
                if (data.status === "OK") {
                    sunriseTime = new Date(data.results.sunrise);
                    sunsetTime = new Date(data.results.sunset);
                    document.getElementById('sun-info').textContent = 
                        `Sunrise: ${sunriseTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} | Sunset: ${sunsetTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                }
            } catch (error) {
                document.getElementById('sun-info').textContent = "Could not load sun schedule";
            }
        }

        function updateDashboard() {
            const now = new Date();
            
            // Clock
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            // Date
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const day = days[now.getDay()];
            document.getElementById('date').textContent = `${year}년 ${month}월 ${date}일 ${day}요일`;

            // Night mode brightness adjustment based on sunrise/sunset
            if (sunriseTime && sunsetTime) {
                if (now < sunriseTime || now > sunsetTime) {
                    document.body.classList.add('night-mode');
                } else {
                    document.body.classList.remove('night-mode');
                }
            }
        }

        fetchSunSchedule();
        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>

</body>
</html>
