<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Home Hub</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background 2s ease, filter 2s ease;
        }
        .night-mode {
            filter: brightness(0.85); /* Slightly dims the white background at night */
            background: linear-gradient(135deg, #e0e0e0, #cccccc);
        }
        #clock {
            font-size: 6rem;
            font-weight: bold;
        }
        #date {
            font-size: 2rem;
            margin-top: 1rem;
            color: #555;
        }
        #info-container {
            display: flex;
            gap: 2rem;
            margin-top: 1.5rem;
            color: #666;
            font-size: 1.1rem;
        }
        #calendar-container {
            margin-top: 2rem;
            background: rgba(0, 0, 0, 0.03);
            padding: 1rem 2rem;
            border-radius: 10px;
            text-align: center;
            max-width: 600px;
            border: 1px solid #ddd;
        }
        #calendar-title {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        #calendar-events {
            font-size: 1rem;
            color: #555;
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>
    <div id="date">Month 00, 0000 Day</div>
    
    <div id="info-container">
        <div id="weather">Loading weather...</div>
        <div id="sun-info">Loading sun schedule...</div>
    </div>

    <div id="calendar-container">
        <div id="calendar-title">Google Calendar</div>
        <div id="calendar-events">Connecting to calendar soon...</div>
    </div>

    <script>
        let sunriseTime = null;
        let sunsetTime = null;

        // Fetch Atlanta Weather
        async function fetchWeather() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=33.7490&longitude=-84.3880&current=temperature_2m,weather_code&temperature_unit=fahrenheit');
                const data = await response.json();
                const temp = Math.round(data.current.temperature_2m);
                document.getElementById('weather').textContent = `Atlanta: ${temp}°F`;
            } catch (error) {
                document.getElementById('weather').textContent = "Weather unavailable";
            }
        }

        // Fetch sunrise and sunset times for Atlanta
        async function fetchSunSchedule() {
            try {
                const response = await fetch('https://api.sunrise-sunset.org/json?lat=33.7490&lng=-84.3880&formatted=0');
                const data = await response.json();
                if (data.status === "OK") {
                    sunriseTime = new Date(data.results.sunrise);
                    sunsetTime = new Date(data.results.sunset);
                    document.getElementById('sun-info').textContent = 
                        `Sunrise: ${sunriseTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} | Sunset: ${sunsetTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                }
            } catch (error) {
                document.getElementById('sun-info').textContent = "Sun schedule unavailable";
            }
        }

        function updateDashboard() {
            const now = new Date();
            
            // Clock
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            // Date in English (e.g., September 11, 2026, Friday)
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);

            // Night mode
            if (sunriseTime && sunsetTime) {
                if (now < sunriseTime || now > sunsetTime) {
                    document.body.classList.add('night-mode');
                } else {
                    document.body.classList.remove('night-mode');
                }
            }
        }

        fetchWeather();
        fetchSunSchedule();
        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>

</body>
</html>
